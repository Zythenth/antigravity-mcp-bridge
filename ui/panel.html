<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity</title>
  <style>/* __PANEL_CSS__ */</style>
</head>
<body>
  <div id="app" class="panel-root in-tasks-view">
    <!-- Header -->
    <header class="panel-header">
      <div class="panel-header-left">
        <button id="btn-back" class="nav-back-button" type="button" aria-label="Voltar para a lista de tarefas" hidden>
          <svg class="nav-back-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
          </svg>
        </button>
        <span id="detail-header-avatar" class="detail-header-avatar" hidden aria-hidden="true"></span>
        <span id="panel-title" class="panel-title">Antigravity</span>
        <span id="detail-header-model" class="detail-header-model" hidden></span>
      </div>
      <div class="panel-header-right">
        <span id="host-status" class="status-badge" role="status" aria-live="polite">Conectando...</span>
      </div>
    </header>

    <!-- Error / Offline banner -->
    <div id="global-banner" class="global-banner" role="alert" hidden>
      <span id="global-banner-text" class="banner-text"></span>
      <button id="btn-retry-banner" class="button-secondary button-small" type="button">Tentar novamente</button>
    </div>

    <!-- Main single layout container -->
    <main class="panel-main">
      <!-- Task List Screen -->
      <section id="sidebar-pane" class="tasks-screen" aria-label="Lista de tarefas">
        <!-- Hidden tab controls kept for backwards compatibility / event wiring -->
        <div class="tasks-tabs-hidden" role="tablist" aria-label="Filtrar status da tarefa" hidden>
          <button id="tab-active" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="task-list">Ativas</button>
          <button id="tab-done" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="task-list">Concluídas</button>
        </div>

        <div id="tasks-loading" class="state-message" role="status">Carregando tarefas...</div>
        <div id="tasks-empty" class="state-message" hidden>Nenhuma tarefa encontrada.</div>

        <div id="task-list" class="task-list" role="region" aria-label="Tarefas"></div>
      </section>

      <!-- Detail / Conversation Screen -->
      <section id="detail-pane" class="detail-screen" aria-label="Detalhes da tarefa selecionada">
        <div id="no-task-selected" class="state-message is-centered">
          Nenhuma tarefa selecionada. Selecione uma tarefa na lista.
        </div>

        <div id="task-content" class="task-content" hidden>
              <div id="selected-task-error-banner" class="task-error-box" hidden role="alert">
                <span id="selected-task-error-text"></span>
              </div>
          <details id="task-options" class="task-options"><summary>Opções da tarefa</summary>
          <!-- Task Subhead / Actions Bar -->
          <div class="detail-header">
            <div class="detail-meta">
              <h1 id="selected-task-title" class="detail-title"></h1>
              <div class="detail-subhead">
                <span id="selected-task-model" class="meta-tag"></span>
                <span id="selected-task-status" class="meta-status" role="status"></span>
                <span id="selected-task-mode" class="meta-mode"></span>
              </div>

            </div>
            <div class="detail-actions">
              <button id="btn-parent-task" class="button-secondary button-small" type="button" hidden>Turno anterior</button>
              <button id="btn-cancel-task" class="button-danger button-small" type="button">Cancelar tarefa</button>
            </div>
          </div>

          <!-- Controls Bar: Delivery mode & Share summary -->
          <div class="detail-controls">
            <div class="control-group">
              <label for="select-delivery-mode" class="control-label">Entrega:</label>
              <select id="select-delivery-mode" class="select-compact" aria-label="Modo de entrega">
                <option value="messages">Somente mensagens</option>
                <option value="events">Eventos completos</option>
              </select>
            </div>
            <div class="control-group">
              <button id="btn-share-codex" class="button-secondary button-small" type="button" title="Envia um resumo compacto (metadados e ref) ao Codex">
                Enviar resumo ao Codex
              </button>
            </div>
          </div>

          </details>

          <!-- Conversation & Responses Viewport -->
          <div id="conversation-viewport" class="conversation-viewport" role="log" aria-live="off">
            <div id="notice-truncated" class="notice-bar" hidden>
              <span id="notice-truncated-text">Alguns eventos antigos foram rotacionados pelo backend.</span>
            </div>

            <div id="caller-messages-section" class="section-card" hidden>
              <div class="section-card-title">Suas mensagens e recibos</div>
              <div id="caller-messages"></div>
            </div>

            <!-- Public response stream / final answer -->
            <div class="conversation-response-section">
              <div id="public-response-container" class="response-container">
                <div id="public-response-body" class="markdown-body"></div>
              </div>
              <div id="response-pagination" class="pagination-footer" hidden>
                <span id="response-page-info" class="text-subtle"></span>
                <button id="btn-load-more-response" class="button-secondary button-small" type="button">Carregar mais</button>
              </div>
            </div>

            <div id="changed-files" aria-label="Alterações na cópia"></div>

            <div id="processing-status" class="processing-status" hidden><div id="processing-status-text"></div><span id="processing-action"></span></div>

            <!-- Expandable Activity History -->
            <details id="activity-details" class="activity-accordion">
              <summary class="activity-summary">
                <span id="activity-summary-title">Atividade recente</span>
              </summary>
              <div class="activity-body">
                <div id="activity-pagination-bar" class="activity-pagination-bar" hidden>
                  <span id="activity-cursor-info" class="text-subtle"></span>
                  <button id="btn-load-older-events" class="button-secondary button-small" type="button">Carregar eventos anteriores</button>
                  <button id="btn-live-events" class="button-secondary button-small" type="button" hidden>Voltar ao vivo</button>
                </div>
                <div id="events-stream" class="events-stream"></div>
              </div>
            </details>
          </div>

          <!-- Composer -->
          <footer class="composer-container">
            <form id="composer-form" class="composer-form">
              <label for="composer-input" class="composer-label">Mensagem ao agente</label>
              <div class="composer-input-row">
                <textarea
                  id="composer-input"
                  class="composer-textarea"
                  rows="2"
                  placeholder="Digite sua mensagem (Enter envia, Shift+Enter nova linha)..."
                  aria-label="Mensagem ao agente"
                ></textarea>
                <div class="composer-actions">
                  <button id="btn-send-message" class="button-primary" type="submit">Enviar</button>
                </div>
              </div>
              <div class="composer-footer">
                <span id="composer-feedback" class="status-hint" role="status" aria-live="polite"></span>
                <div class="composer-tokens">
                  <span>Tokens: </span>
                  <span id="token-usage-counter" class="token-value">Não informado</span>
                </div>
              </div>
            </form>
          </footer>
        </div>
      </section>
    </main>
  </div>

  <dialog id="patch-dialog" class="patch-dialog"><header><h2 id="patch-dialog-title"></h2><button id="patch-dialog-close" type="button" class="button-secondary">Fechar</button></header><pre id="patch-dialog-body"></pre></dialog>
  <script id="native-avatar-resources" type="application/json">/* __NATIVE_AVATAR_RESOURCES__ */</script>
  <script type="module">/* __PANEL_JS__ */</script>
</body>
</html>
