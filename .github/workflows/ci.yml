name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:plugin
      - if: runner.os == 'Windows'
        run: node plugin/server.mjs --prepare-windows-runtime
        env:
          BRIDGE_WINDOWS_NODE_CACHE_DIRECTORY: ${{ runner.temp }}/antigravity-node-cache
      - if: runner.os == 'Windows'
        run: npm test
        env:
          BRIDGE_WINDOWS_NODE_RUNTIME: portable
          BRIDGE_WINDOWS_NODE_CACHE_DIRECTORY: ${{ runner.temp }}/antigravity-node-cache
      - if: runner.os != 'Windows'
        run: npm test
      - run: npm run test:package
        env:
          BRIDGE_WINDOWS_NODE_CACHE_DIRECTORY: ${{ runner.temp }}/antigravity-node-cache
